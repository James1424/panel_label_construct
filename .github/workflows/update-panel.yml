name: Update ETF Tail Panel

on:
  workflow_dispatch:
    inputs:
      max_tickers:
        description: "Optional debug cap after ETF universe is built. 0 means all."
        required: false
        default: "0"
      chunk_size:
        description: "yfinance batch size"
        required: false
        default: "80"
      sleep_seconds:
        description: "sleep between batches"
        required: false
        default: "1.0"
  schedule:
    - cron: "0 7 * * 0"

permissions:
  contents: write

jobs:
  update-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build ETF/index holdings universe
        run: python -m src.get_holdings_universe
      - name: Download daily prices
        run: |
          python -m src.download_data \
            --max-tickers "${{ github.event.inputs.max_tickers || '0' }}" \
            --chunk-size "${{ github.event.inputs.chunk_size || '80' }}" \
            --sleep "${{ github.event.inputs.sleep_seconds || '1.0' }}"
      - name: Build monthly panel
        run: python -m src.build_panel
      - name: Update README
        run: python -m src.update_readme
      - name: Commit updated reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update ETF tail panel reports"
          file_pattern: "README.md data/seed_universe.csv data/seed_universe_sources_long.csv data/holding_source_failures.csv data/download_failures.csv outputs/*.csv outputs/*.txt"
